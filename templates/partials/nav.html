<!-- Navigation Bar -->
<style>
    .navbar .nav-link {
        transition: color 0.2s ease-in-out;
    }

    .navbar .nav-link:hover,
    .navbar .nav-link:focus,
    .navbar .nav-link.active {
        color: #ffffff !important;
    }
</style>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark ms-auto">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('home') }}">Brawlable</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link{% if request.endpoint == 'home' %} active{% endif %}"
                        href="{{ url_for('home') }}" {% if request.endpoint=='home' %}aria-current="page" {% endif
                        %}>Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link{% if request.endpoint == 'contact' %} active{% endif %}"
                        href="{{ url_for('contact') }}" {% if request.endpoint=='contact' %}aria-current="page" {% endif
                        %}>Contact</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
